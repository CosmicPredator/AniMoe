# ============================================================
# GitLab CI — GPUI-rs Windows Build Pipeline
# ============================================================
# Targets: Windows (x86_64-pc-windows-msvc)
# Runner:  windows-shell OR docker (windows containers)
# ============================================================

variables:
  RUST_VERSION: "stable"                  # or pin: "1.79.0"
  TARGET: "x86_64-pc-windows-msvc"
  CARGO_INCREMENTAL: "0"                  # deterministic builds in CI
  CARGO_TERM_COLOR: "always"
  RUSTFLAGS: "-D warnings"
  # Sccache — optional but recommended for faster rebuilds
  SCCACHE_DIR: "$CI_PROJECT_DIR/.sccache"
  RUSTC_WRAPPER: ""                       # set to "sccache" if runner has it

# ── Cache ────────────────────────────────────────────────────
.cargo_cache: &cargo_cache
  key:
    files:
      - Cargo.lock
    prefix: "cargo-windows-$TARGET"
  paths:
    - .cargo/registry/index/
    - .cargo/registry/cache/
    - .cargo/git/db/
    - target/
  policy: pull-push

# ── Default settings ─────────────────────────────────────────
default:
  tags:
    - saas-windows-medium-amd64          # <-- GitLab runner tag; adjust to your runner label
  before_script:
    # Install rustup if not already present
    - |
      if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
        Write-Host "rustup not found — installing..."
        Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "$env:TEMP\rustup-init.exe"
        & "$env:TEMP\rustup-init.exe" -y --default-toolchain $env:RUST_VERSION --default-host $env:TARGET --no-modify-path
        $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
      } else {
        Write-Host "rustup already installed — skipping install"
        $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
      }
    - rustup update $env:RUST_VERSION
    - rustup default $env:RUST_VERSION
    - rustup target add $env:TARGET
    - rustup show
    - cargo --version
    - rustc --version

# ── Stages ───────────────────────────────────────────────────
stages:
  - check
  - build
  - package

# ============================================================
# STAGE: check
# ============================================================

fmt:
  stage: check
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  allow_failure: false

clippy:
  stage: check
  script:
    - rustup component add clippy
    # GPUI needs DirectX / Windows SDK headers — ensure they are on PATH
    # (handled by the runner image; see Runner Setup notes below)
    - cargo clippy --target $TARGET --all-targets --all-features -- -D warnings
  cache:
    <<: *cargo_cache
    policy: pull

# ============================================================
# STAGE: build
# ============================================================

.build_base: &build_base
  stage: build
  cache:
    <<: *cargo_cache
  artifacts:
    expire_in: 1 day

build:debug:
  <<: *build_base
  script:
    - cargo build --target $TARGET
  artifacts:
    name: "$CI_PROJECT_NAME-debug-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/$TARGET/debug/*.exe
      - target/$TARGET/debug/*.dll
    expire_in: 1 day

build:release:
  <<: *build_base
  script:
    - cargo build --target $TARGET --release
  artifacts:
    name: "$CI_PROJECT_NAME-release-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/$TARGET/release/*.exe
      - target/$TARGET/release/*.dll
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'
    - when: manual           # allow triggering on any branch manually

# ============================================================
# STAGE: package
# ============================================================

# Bundles the release binary + required DLLs + assets into a zip
package:zip:
  stage: package
  needs: ["build:release"]
  script:
    - mkdir dist
    - copy target\$TARGET\release\*.exe dist\
    # Copy any DLLs your GPUI app ships (e.g. blade-graphics deps)
    - if exist target\$TARGET\release\*.dll copy target\$TARGET\release\*.dll dist\
    # Copy assets folder if it exists
    - if exist assets xcopy /E /I assets dist\assets
    - powershell Compress-Archive -Path dist\* -DestinationPath "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-windows-x64.zip"
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA-windows-x64"
    paths:
      - "*.zip"
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG'

# Optional: build an MSI with WiX Toolset
package:msi:
  stage: package
  needs: ["build:release"]
  allow_failure: true            # remove once WiX is configured
  script:
    # Assumes wix toolset is installed on the runner
    - cargo install cargo-wix --locked
    - cargo wix --target $TARGET --nocapture
  artifacts:
    paths:
      - target/wix/*.msi
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG'